name: test

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      # No terminal is attached on a runner. Every test drives the renderer
      # through a bytes.Buffer for exactly that reason, so a green run here
      # also proves the code never reaches for a tty it does not have.
      - name: Test
        timeout-minutes: 5
        run: go test -count=1 -shuffle=on -timeout 60s ./...
      # -race needs cgo, so it gets its own step outside the CGO_ENABLED=0 env.
      - name: Test (race)
        timeout-minutes: 5
        env:
          CGO_ENABLED: '1'
        run: go test -race -count=1 -timeout 120s ./...

  cross:
    name: cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The shipped binary is CGO_ENABLED=0 on every target; the matrix above
      # only covers the two the runners can execute.
      - name: Build every target
        run: |
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            echo "== $t"
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -o /dev/null ./...
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Install linters
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: Lint (every GOOS)
        run: |
          for os in darwin linux; do
            echo "== GOOS=$os =="
            GOOS=$os $(go env GOPATH)/bin/golangci-lint run ./...
          done
      - name: staticcheck
        run: $(go env GOPATH)/bin/staticcheck ./...
      - name: gosec
        run: $(go env GOPATH)/bin/gosec -quiet ./...
      - name: gocognit
        run: |
          $(go env GOPATH)/bin/golangci-lint run --no-config --default=none \
            --enable=gocognit --tests=false ./...
